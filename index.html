/* ============================================================
   PESCA EN EL HIELO — v3

   - La pesca se va apilando sobre el hielo junto a la hielera
   - Tiburones roban el pez enganchado; su aleta avisa antes
   - Pez gris: errático, vale 2 monedas
   - Final: cinemática del MULLET (3 avistamientos + 3 vueltas)

   Sin conexión: todo (arte, música, lógica, ícono) vive en este

/* ---------- Lienzo y resolución virtual ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const VW = 800, VH = 600;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = Math.min(w / VW, h / VH);
  offX = (w - VW * scale) / 2;
  offY = (h - VH * scale) / 2;
}

/* ---------- Utilidades ---------- */
const rand = (a, b) => a + Math.random() * (b - a);

const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- Audio: contexto ---------- */
let AC = null;
function ac() {
  if (!AC) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (Ctor) AC = new Ctor();
  }
  return AC;
}

/* ---------- SFX ---------- */
function tone(freq, dur, type, vol, slideTo) {
  if (G.muted) return;
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.15, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
function noiseBurst(dur, vol, low) {
  if (G.muted) return;
  const a = ac(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter();
  f.type = low ? 'lowpass' : 'highpass';
  f.frequency.value = low ? 500 : 1500;
  const g = a.createGain(); g.gain.value = vol || 0.2;
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start();
}

];
const BASSLINE = [
  [0,36,2],[4,43,2],[8,36,2],[12,43,2],
  [16,33,2],[20,40,2],[24,33,2],[28,40,2],
  [32,41,2],[36,48,2],[40,41,2],[44,48,2],
  [48,43,2],[52,50,2],[56,43,2],[60,47,2],
];
const MEL_AT = {}, BASS_AT = {};
for (const n of MELODY) (MEL_AT[n[0]] = MEL_AT[n[0]] || []).push(n);
for (const n of BASSLINE) (BASS_AT[n[0]] = BASS_AT[n[0]] || []).push(n);

function stepDur(i) { return (i % 2 === 0 ? 0.58 : 0.42) * M_BEAT; }
function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function mnote(t, midi, steps, type, vol) {
  const a = ac(); if (!a || !MUSIC.gain) return;
  const dur = steps * (M_BEAT / 2) * 0.92;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.value = midiHz(midi);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(MUSIC.gain);
  o.start(t); o.stop(t + dur + 0.05);
}
function mhat(t) {
  const a = ac(); if (!a || !MUSIC.gain) return;
  if (!MUSIC.noiseBuf) {
    const len = Math.floor(a.sampleRate * 0.05);
    MUSIC.noiseBuf = a.createBuffer(1, len, a.sampleRate);
    const d = MUSIC.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  }
  const src = a.createBufferSource(); src.buffer = MUSIC.noiseBuf;
  const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
  const g = a.createGain(); g.gain.value = 0.03;
  src.connect(f); f.connect(g); g.connect(MUSIC.gain);
  src.start(t);
}
function playStep(s, t) {
  const mel = MEL_AT[s];
  if (mel) for (const n of mel) mnote(t, n[1], n[2], 'triangle', 0.055);
  const bs = BASS_AT[s];
  if (bs) for (const n of bs) mnote(t, n[1], n[2], 'sine', 0.06);
  if (s % 4 === 2) mhat(t);
}
function musTick() {
  if (!MUSIC.on) return;
  const a = ac(); if (!a) return;
  while (MUSIC.nextT < a.currentTime + 0.16) {
    playStep(MUSIC.step % M_STEPS, MUSIC.nextT);
    MUSIC.nextT += stepDur(MUSIC.step % 2);
    MUSIC.step++;
  }
}
function setMusicLevel(l) {
  MUSIC.level = l;
  if (MUSIC.gain) MUSIC.gain.gain.value = G.muted ? 0 : l;
}
function startMusic() {
  const a = ac(); if (!a) return;
  if (!MUSIC.gain) { MUSIC.gain = a.createGain(); MUSIC.gain.connect(a.destination); }
  setMusicLevel(0.9);
  MUSIC.on = true;
  MUSIC.step = 0;
  MUSIC.nextT = a.currentTime + 0.1;
  if (!MUSIC.id) MUSIC.id = setInterval(musTick, 25);
}
function stopMusic() { MUSIC.on = false; }

/* ---------- Estado ---------- */
const G = {};
function reset() {
  G.state = 'title';        // title | play | over | win
  G.phase = 'announce';     // announce | wave | cinematic | fight
  G.time = 0;
  G.coins = 0;
  G.worms = CONFIG.WORMS;
  G.caught = 0;
  G.wave = 1;
  G.waveT = 0;
  G.robot = null;
  G.hook = { y: 300, targetY: 300, attached: null, stunT: 0 };
  G.fishes = []; G.jellies = []; G.junks = [];
  G.sharks = []; G.fins = []; G.pendingSharks = [];
  G.iceCrab = null;
  G.mullet = null;
  G.mulletTimer = 0;
  G.cine = null;
  G.tFish = Infinity; G.tJelly = Infinity; G.tShark = Infinity;
  G.tCrab = Infinity; G.tJunk = Infinity;
  G.floats = []; G.parts = []; G.bolts = 0;
  G.pile = []; G.pileCols = [0, 0, 0, 0, 0, 0];
  G.shakeT = 0; G.endT = null;
  G.banner = null;
  if (G.muted === undefined) G.muted = false;
  if (!G.snow) {
    G.snow = [];
    for (let i = 0; i < 40; i++) G.snow.push({ x: rand(0, VW), y: rand(0, ICE_Y), v: rand(12, 30), ph: rand(0, 6) });
  }
  G.bubbles = [];
  for (let i = 0; i < 10; i++) G.bubbles.push(newBubble(true));
}
function newBubble(anyY) {
  return { x: rand(20, VW - 20), y: anyY ? rand(ICE_Y + 40, FLOOR_Y) : FLOOR_Y - rand(0, 16), r: rand(2, 5), v: rand(18, 40), ph: rand(0, 6) };
}
reset();

/* ---------- Robot anunciador ---------- */
function startRobot(sign, after, fast) {
  G.robot = { x: -80, v: fast ? 210 : 120, state: 'in', holdT: 0, sign, after, fast: !!fast };
}
function finishRobot() {
  const after = G.robot.after;
  G.robot = null;
  if (after === 'wave') {
    G.phase = 'wave';
    G.waveT = CONFIG.WAVE_TIME[G.wave - 1];
    const M = WAVES[G.wave - 1];
    G.tFish = 1.0;
    G.tJelly = M.jelly ? rand(M.jelly[0], M.jelly[1]) : Infinity;
    G.tShark = M.shark ? rand(M.shark[0], M.shark[1]) : Infinity;
    const ce = CRAB_EVERY[G.wave - 1];
    G.tCrab = ce ? rand(ce[0], ce[1]) : Infinity;
    G.tJunk = M.junk ? rand(M.junk[0], M.junk[1]) : Infinity;
  } else {
    G.phase = 'fight';
    G.mulletTimer = 1.4;
    G.tFish = 1.2;
    setMusicLevel(0.5);
  }
}

/* ---------- Spawns ---------- */
function spawnFishEntity(forceNormal) {
  const M = WAVES[Math.min(G.wave, 5) - 1];
  const dir = Math.random() < 0.5 ? 1 : -1;
  const sp = rand(65, 135) * (G.phase === 'wave' ? M.speed : 1);
  const f = {
    x: dir > 0 ? -30 : VW + 30,
    y: rand(ICE_Y + 55, FLOOR_Y - 40),
    vx: sp * dir, vy: 0,
    ph: rand(0, 6),
    kind: 'n', variant: 'straight',
  };
  if (!forceNormal && Math.random() < M.gray) {
    f.kind = 'g';
    const r = Math.random();
    if (r < 0.30) {
      f.variant = 'dash';
      f.vx *= 2.2;
    } else if (r < 0.65) {
      f.variant = 'u';
      f.sp = Math.abs(f.vx) * 1.1;
      f.a = dir > 0 ? 0 : Math.PI;
      f.rot = dir > 0 ? 1 : -1;
      f.turned = 0;
      f.turnX = dir > 0 ? rand(VW * 0.35, VW * 0.62) : rand(VW * 0.38, VW * 0.65);
    } else if (r < 0.85) {
      f.variant = 'wave';
      f.baseY = f.y;
      f.amp = rand(18, 32);
      f.fq = rand(2, 3.4);
    }
  }
  G.fishes.push(f);
}
function spawnJelly() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  G.jellies.push({
    x: dir > 0 ? -30 : VW + 30,
    baseY: rand(ICE_Y + 75, FLOOR_Y - 70),
    y: 0, v: rand(22, 40) * dir, ph: rand(0, 6),
  });
}
function spawnFin() {
  const fromLeft = Math.random() < 0.5;
  G.fins.push({ x: fromLeft ? -50 : VW + 50, v: (fromLeft ? 1 : -1) * 230 });
  noiseBurst(0.3, 0.08, true);
}
function spawnShark(from) {
  const M = WAVES[Math.min(G.wave, 5) - 1];
  const fromRight = from === 'R';
  G.sharks.push({
    x: fromRight ? VW + 70 : -70,
    y: clamp(G.hook.y + rand(-30, 30), ICE_Y + 70, FLOOR_Y - 40),
    v: (fromRight ? -1 : 1) * 165 * M.speed,
    ate: false, ph: rand(0, 6),
  });
}
function spawnIceCrab() {
  if (G.iceCrab) return;
  const side = Math.random() < 0.5 ? -1 : 1; // -1 = entra por la izquierda
  G.iceCrab = {
    x: side < 0 ? -34 : VW + 34,
    tgt: side < 0 ? LINE_X - 46 : LINE_X + 46,
    v: side < 0 ? 72 : -72,
    side, state: 'walk', cutT: 0, tick: 0,
  };
}
function spawnJunk() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  const r = Math.random();
  const kind = r < 0.34 ? 'boot' : (r < 0.67 ? 'can' : 'barrel');
  G.junks.push({
    x: dir > 0 ? -30 : VW + 30,
    y: rand(ICE_Y + 85, FLOOR_Y - 55),
    v: rand(18, 34) * dir,
    kind, r: kind === 'barrel' ? 30 : 26,
    rot: rand(0, 6), rv: rand(-0.6, 0.6), ph: rand(0, 6),
  });
}
function spawnMullet() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  G.mullet = {
    x: dir > 0 ? -80 : VW + 80,
    y: clamp(G.hook.y + rand(-50, 50), ICE_Y + 85, FLOOR_Y - 45),
    v: 95 * dir, ph: rand(0, 6), flee: false, cool: 0,
  };
  sndMullet();
}

/* ---------- Efectos ---------- */
function addFloat(x, y, txt, color) {
  G.floats.push({ x, y, txt, color, t: 1.1 });
}
function splashAt(x, y) {
  for (let i = 0; i < 10; i++) {
    G.parts.push({ x, y, vx: rand(-70, 70), vy: rand(-140, -40), t: rand(0.35, 0.6), color: 'rgba(214,238,255,0.9)', r: rand(2, 4) });
  }
  sndSplash();
}

/* ---------- Pila de pesca sobre el hielo ----------
   Crece de forma orgánica: casi siempre cae un pez al montón,
   a veces dos y a veces ninguno, así que la pila acompaña la
   pesca sin ser un contador exacto. */
function addToPile(gray) {
  const r = Math.random();
  let n = 1;
  if (r < 0.10) n = 0;
  else if (r > 0.80) n = 2;
  for (let i = 0; i < n; i++) pilePush(gray && i === 0);
}
function pilePush(gray) {
  if (G.pile.length >= 66) return;
  // columna aleatoria sesgada hacia las más bajas (forma de montículo)
  let c = Math.floor(rand(0, G.pileCols.length));
  for (let k = 0; k < 2; k++) {
    const c2 = Math.floor(rand(0, G.pileCols.length));
    if (G.pileCols[c2] < G.pileCols[c]) c = c2;
  }
  const x = 18 + c * 15 + rand(-5, 5);
  const y = ICE_Y - 8 - G.pileCols[c] * 13 + rand(-2, 2);
  G.pileCols[c]++;
  G.pile.push({
    x, y,
    rot: rand(-0.5, 0.5),
    flip: Math.random() < 0.5 ? 1 : -1,
    gray: !!gray,
  });
}

/* ---------- Daño ---------- */
function loseWorm(msg) {
  G.worms--;
  G.hook.attached = null;
  G.hook.stunT = 1.0;
  G.shakeT = 0.35;
  addFloat(LINE_X, G.hook.y - 26, msg, '#FF9B8F');
  if (G.worms <= 0) G.endT = 1.1;
}

/* ---------- Fin de oleada / cinemática ---------- */
function endWave() {
  if (G.iceCrab && G.iceCrab.state !== 'flee') {
    G.iceCrab.state = 'flee';
    G.iceCrab.v = G.iceCrab.side < 0 ? -170 : 170;
  }
  G.fins = []; G.pendingSharks = [];
  G.tFish = Infinity; G.tJelly = Infinity; G.tShark = Infinity;
  G.tCrab = Infinity; G.tJunk = Infinity;
  if (G.wave < 5) {
    G.wave++;
    G.phase = 'announce';
    startRobot(SIGNS[G.wave - 1], 'wave', false);
    sndWave();
  } else {
    // limpieza total del escenario para el MULLET
    G.phase = 'cinematic';
    G.cine = { step: 0, wait: 0.9, sil: null, fin: null, lap: 0 };
    G.fishes = []; G.jellies = []; G.junks = [];
    G.sharks = []; G.fins = []; G.pendingSharks = [];
    G.iceCrab = null;
    setMusicLevel(0.35);
    G.banner = { t: 2.6, txt: '...el agua se queda en silencio...' };
    sndBoom();
  }
}

/* ---------- Update ---------- */
function update(dt) {
  G.time += dt;
  if (G.shakeT > 0) G.shakeT -= dt;

  const amb = reducedMotion ? 0.3 : 1;
  for (const s of G.snow) {
    s.y += s.v * dt;
    s.x += Math.sin(G.time * 0.8 + s.ph) * 10 * dt * amb;
    if (s.y > ICE_Y - 4) { s.y = -4; s.x = rand(0, VW); }
  }
  for (const b of G.bubbles) {
    b.y -= b.v * dt;
    b.x += Math.sin(G.time * 2 + b.ph) * 8 * dt * amb;
    if (b.y < ICE_Y + 16) Object.assign(b, newBubble(false));
  }
  for (const f of G.floats) { f.t -= dt; f.y -= 30 * dt; }
  G.floats = G.floats.filter(f => f.t > 0);
  for (const p of G.parts) { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt; }
  G.parts = G.parts.filter(p => p.t > 0);
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }

  if (G.state !== 'play') return;

  if (G.endT !== null) {
    G.endT -= dt;
    if (G.endT <= 0) { G.state = 'over'; G.endT = null; stopMusic(); sndOver(); }
  }

  /* --- robot anunciador --- */
  if (G.robot) {
    const r = G.robot;
    if (r.state === 'in') {
      r.x += r.v * dt;
      if (r.x >= 380) { r.state = 'hold'; r.holdT = r.fast ? 1.1 : 2.1; }
    } else if (r.state === 'hold') {
      r.holdT -= dt;
      if (r.holdT <= 0) r.state = 'out';
    } else {
      r.x += r.v * 1.5 * dt;
      if (r.x > VW + 100) finishRobot();
    }
  }

  /* --- temporizador de oleada --- */
  if (G.phase === 'wave') {
    G.waveT -= dt;
    if (G.waveT <= 0) endWave();
  }

  /* --- anzuelo --- */
  const H = G.hook;
  if (H.stunT > 0) H.stunT -= dt;
  const heavy = H.attached && H.attached.type === 'mullet';
  const k = heavy ? 3.2 : CONFIG.HOOK_FOLLOW;
  H.y = lerp(H.y, H.targetY, Math.min(1, k * dt));
  if (heavy) {
    H.y += CONFIG.MULLET_PULL * dt;
    if (Math.random() < dt * 1.2) H.y += rand(8, 22);
  }
  H.y = clamp(H.y, HOOK_MIN, HOOK_MAX);

  /* --- spawns de oleada --- */
  if (G.phase === 'wave') {
    const M = WAVES[G.wave - 1];
    G.tFish -= dt;
    if (G.tFish <= 0) {
      if (G.fishes.length < M.fishMax) spawnFishEntity(false);
      G.tFish = rand(M.fish[0], M.fish[1]);
    }
    if (isFinite(G.tJelly)) { G.tJelly -= dt; if (G.tJelly <= 0) { spawnJelly(); G.tJelly = rand(M.jelly[0], M.jelly[1]); } }
    if (isFinite(G.tShark)) { G.tShark -= dt; if (G.tShark <= 0) { spawnFin(); G.tShark = rand(M.shark[0], M.shark[1]); } }
    if (isFinite(G.tCrab)) {
      G.tCrab -= dt;
      if (G.tCrab <= 0) {
        spawnIceCrab();
        const ce = CRAB_EVERY[G.wave - 1];
        G.tCrab = rand(ce[0], ce[1]);
      }
    }
    if (isFinite(G.tJunk)) { G.tJunk -= dt; if (G.tJunk <= 0) { spawnJunk(); G.tJunk = rand(M.junk[0], M.junk[1]); } }
  }

  /* --- pez de reabastecimiento en la pelea final --- */
  if (G.phase === 'fight') {
    const hasFishHooked = H.attached && H.attached.type === 'fish';
    if (G.fishes.length === 0 && !hasFishHooked) {
      G.tFish -= dt;
      if (G.tFish <= 0) { spawnFishEntity(true); G.tFish = 1.8; }
    } else {
      G.tFish = 1.2;
    }
  }

  /* --- cinemática del Mullet --- */
  if (G.phase === 'cinematic') {
    const cn = G.cine;
    if (cn.sil) {
      cn.sil.x += cn.sil.v * dt;
      if (cn.sil.x < -100 || cn.sil.x > VW + 100) {
        cn.sil = null;
        cn.wait = cn.step === 3 ? 0.45 : 1.0;
      }
    } else if (cn.fin) {
      cn.fin.x += cn.fin.v * dt;
      if (cn.fin.x < -160 || cn.fin.x > VW + 160) { cn.fin = null; cn.wait = 0.7; }
    } else {
      cn.wait -= dt;
      if (cn.wait <= 0) {
        if (cn.step === 0) {
          cn.sil = { x: -80, v: 160, y: FLOOR_Y - 26, sc: 0.55, al: 0.28 };
          spawnFishEntity(true); sndBoom(); cn.step = 1;
        } else if (cn.step === 1) {
          cn.sil = { x: VW + 80, v: -175, y: FLOOR_Y - 46, sc: 0.78, al: 0.42 };
          spawnFishEntity(true); sndBoom(); cn.step = 2;
        } else if (cn.step === 2) {
          cn.fin = { x: -150, v: 200 };
          spawnFishEntity(true); sndBoom(); cn.step = 3;
        } else if (cn.step === 3) {
          if (cn.lap < 3) {
            const d = cn.lap % 2 === 0 ? 1 : -1;
            cn.sil = { x: d > 0 ? -90 : VW + 90, v: d * 280, y: FLOOR_Y - 36, sc: 0.95, al: 0.5 };
            sndBoom();
            cn.lap++;
          } else {
            startRobot(['¡EL MULLET!', 'Usa un pez de carnada'], 'fight', true);
            G.phase = 'announce';
            sndMullet();
          }
        }
      }
    }
  }

  /* --- entidades: movimiento --- */
  for (const f of G.fishes) {
    if (f.variant === 'u') {
      const past = (f.rot > 0 && f.x > f.turnX) || (f.rot < 0 && f.x < f.turnX);
      if (past && f.turned < Math.PI) {
        const w = Math.PI / 1.1;
        const step = Math.min(w * dt, Math.PI - f.turned);
        f.a += f.rot * step;
        f.turned += step;
      }
      f.vx = Math.cos(f.a) * f.sp;
      f.vy = Math.sin(f.a) * f.sp;
      f.x += f.vx * dt;
      f.y = clamp(f.y + f.vy * dt, ICE_Y + 48, FLOOR_Y - 28);
    } else if (f.variant === 'wave') {
      f.x += f.vx * dt;
      f.y = f.baseY + Math.sin(G.time * f.fq + f.ph) * f.amp;
    } else {
      f.x += f.vx * dt;
    }
  }
  G.fishes = G.fishes.filter(f => f.x > -70 && f.x < VW + 70);

  for (const j of G.jellies) {
    j.x += j.v * dt;
    j.y = j.baseY + Math.sin(G.time * 1.6 + j.ph) * 24;
  }
  G.jellies = G.jellies.filter(j => j.x > -60 && j.x < VW + 60);

  for (const fn of G.fins) fn.x += fn.v * dt;
  for (const fn of G.fins) {
    if (fn.v > 0 && fn.x > VW + 60) G.pendingSharks.push({ t: 0.75, from: 'R' });
    else if (fn.v < 0 && fn.x < -60) G.pendingSharks.push({ t: 0.75, from: 'L' });
  }
  G.fins = G.fins.filter(fn => fn.x >= -60 && fn.x <= VW + 60);

  for (const p of G.pendingSharks) {
    p.t -= dt;
    if (p.t <= 0) spawnShark(p.from);
  }
  G.pendingSharks = G.pendingSharks.filter(p => p.t > 0);

  for (const s of G.sharks) {
    s.x += s.v * dt;
    if (!s.ate) s.y = lerp(s.y, clamp(H.y, ICE_Y + 70, FLOOR_Y - 40), Math.min(1, 1.3 * dt));
    if (!s.ate && dist(s.x, s.y, LINE_X, H.y) < 40 && H.attached && H.attached.type === 'fish') {
      H.attached = null;
      s.ate = true;
      s.v *= 1.7;
      sndChomp();
      addFloat(LINE_X, H.y - 24, '¡Un tiburón se robó tu pez!', '#BFD3E0');
    }
  }
  G.sharks = G.sharks.filter(s => s.x > -110 && s.x < VW + 110);

  const cb = G.iceCrab;
  if (cb) {
    if (cb.state === 'walk') {
      cb.x += cb.v * dt;
      if ((cb.v > 0 && cb.x >= cb.tgt) || (cb.v < 0 && cb.x <= cb.tgt)) {
        cb.x = cb.tgt;
        cb.state = 'cut';
        cb.cutT = 2.6;
        cb.tick = 0;
      }
    } else if (cb.state === 'cut') {
      if (H.y <= SURFACE_Y + 6) {
        cb.state = 'flee';
        cb.v = cb.side < 0 ? -170 : 170;
        addFloat(cb.x, ICE_Y + 52, '¡Lo espantaste!', '#BFE3FF');
      } else {
        cb.cutT -= dt;
        cb.tick -= dt;
        if (cb.tick <= 0) { tone(1250, 0.04, 'square', 0.07); cb.tick = 0.55; }
        if (cb.cutT <= 0) {
          sndCut();
          loseWorm('¡El cangrejo cortó tu línea!');
          cb.state = 'flee';
          cb.v = cb.side < 0 ? -170 : 170;
        }
      }
    } else {
      cb.x += cb.v * dt;
      if (cb.x < -60 || cb.x > VW + 60) G.iceCrab = null;
    }
  }

  for (const jk of G.junks) {
    jk.x += jk.v * dt;
    jk.y += Math.sin(G.time * 1.2 + jk.ph) * 8 * dt;
    jk.rot += jk.rv * dt;
  }
  G.junks = G.junks.filter(j => j.x > -60 && j.x < VW + 60);

  /* --- enganchar --- */
  if (!H.attached && H.stunT <= 0) {
    for (let i = 0; i < G.fishes.length; i++) {
      const f = G.fishes[i];
      if (dist(f.x, f.y, LINE_X, H.y) < 24) {
        H.attached = { type: 'fish', kind: f.kind, ph: rand(0, 6) };
        G.fishes.splice(i, 1);
        sndHook();
        addFloat(LINE_X, H.y - 20, 'Picó', C.gold);
        break;
      }
    }
  }
  if (!H.attached && H.stunT <= 0) {
    for (let i = 0; i < G.junks.length; i++) {
      const jk = G.junks[i];
      if (dist(jk.x, jk.y, LINE_X, H.y) < jk.r) {
        H.attached = { type: 'junk', kind: jk.kind, ph: rand(0, 6) };
        G.junks.splice(i, 1);
        sndHook();
        break;
      }
    }
  }

  /* --- medusas: descarga si tocan CUALQUIER punto del cable --- */
  if (H.stunT <= 0) {
    for (const j of G.jellies) {
      const tocaCable = Math.abs(j.x - LINE_X) < 18 && (j.y - 14) < H.y + 6;
      const tocaAnzuelo = dist(j.x, j.y, LINE_X, H.y) < 36;
      if (tocaCable || tocaAnzuelo) {
        sndShock();
        G.bolts = 0.5;
        if (H.attached && H.attached.type === 'mullet') loseWorm('¡Descarga! El Mullet escapó');
        else if (H.attached && H.attached.type === 'fish') loseWorm('¡Descarga! Perdiste el pez');
        else loseWorm('¡Descarga!');
        break;
      }
    }
  }
  if (G.bolts > 0) G.bolts -= dt;

  /* --- Mullet (pelea final) --- */
  if (H.attached && H.attached.type === 'mullet') {
    // ya está en la línea
  } else if (G.mullet) {
    const m = G.mullet;
    if (m.cool > 0) m.cool -= dt;
    m.x += m.v * dt;
    if (!m.flee) m.y = lerp(m.y, clamp(H.y, ICE_Y + 80, FLOOR_Y - 45), Math.min(1, 1.4 * dt));
    if (!m.flee && m.cool <= 0 && dist(m.x, m.y, LINE_X, H.y) < 46) {
      if (H.attached && H.attached.type === 'fish') {
        H.attached = { type: 'mullet', ph: rand(0, 6) };
        G.mullet = null;
        sndMullet();
        addFloat(LINE_X, H.y - 30, '¡El Mullet mordió! Súbelo', C.gold);
        G.banner = { t: 2.2, txt: '¡Tira hacia arriba!' };
      } else if (!H.attached && H.stunT <= 0) {
        loseWorm('El Mullet se comió tu carnada');
        m.flee = true; m.v = -m.v * 1.8; m.cool = 1;
      } else {
        m.cool = 1;
      }
    }
    if (G.mullet && (G.mullet.x < -140 || G.mullet.x > VW + 140)) {
      G.mullet = null;
      G.mulletTimer = rand(2.5, 4);
    }
  } else if (G.phase === 'fight' && G.endT === null) {
    G.mulletTimer -= dt;
    if (G.mulletTimer <= 0) spawnMullet();
  }

  /* --- puntuar en la superficie --- */
  if (H.attached && H.y <= SURFACE_Y) {
    const a = H.attached;
    H.attached = null;
    splashAt(LINE_X, ICE_Y + 10);
    if (a.type === 'fish') {
      const val = a.kind === 'g' ? CONFIG.GRAY_COIN : CONFIG.FISH_COIN;
      G.coins += val;
      G.caught++;
      addFloat(LINE_X, ICE_Y + 30, '+' + val, C.gold);
      sndCoin();
      addToPile(a.kind === 'g');
    } else if (a.type === 'junk') {
      const msg = a.kind === 'boot' ? 'Una bota vieja...' : (a.kind === 'can' ? 'Una lata oxidada...' : 'Un barril mojado...');
      addFloat(LINE_X, ICE_Y + 30, msg, '#B9CBD8');
    } else if (a.type === 'mullet') {
      G.coins += CONFIG.MULLET_COIN;
      addFloat(LINE_X, ICE_Y + 30, '+' + CONFIG.MULLET_COIN, C.gold);
      G.state = 'win';
      stopMusic();
      sndWin();
    }
  }
}

  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a1 = (i / 5) * Math.PI * 2 - Math.PI / 2;
    const a2 = a1 + Math.PI / 5;
    ctx.lineTo(Math.cos(a1) * 11, Math.sin(a1) * 11);
    ctx.lineTo(Math.cos(a2) * 4.5, Math.sin(a2) * 4.5);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = C.weed;
  ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (const wx of [70, 120, 540, 730]) {
    const sway = Math.sin(G.time * 1.4 + wx) * 6;
    ctx.beginPath();
    ctx.moveTo(wx, FLOOR_Y + 4);
    ctx.quadraticCurveTo(wx + sway, FLOOR_Y - 20, wx - sway, FLOOR_Y - 40);
    ctx.stroke();
  }

  // cinemática: silueta del Mullet al fondo
  if (G.cine && G.cine.sil) {
    const s = G.cine.sil;
    drawSil(s.x, s.y, s.sc, s.al, s.v);
  }

  ctx.strokeStyle = 'rgba(200,230,255,0.35)';
  ctx.lineWidth = 1.5;
  for (const b of G.bubbles) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
  }

  // entidades del agua
  for (const jk of G.junks) drawJunk(jk.x, jk.y, jk.kind, jk.rot);
  for (const f of G.fishes) drawFish(f.x, f.y, f.vx >= 0 ? 1 : -1, f.ph, false, f.kind === 'g');
  for (const s of G.sharks) drawShark(s);
  for (const j of G.jellies) drawJelly(j);
  if (G.iceCrab) drawIceCrab(G.iceCrab); // colgado bajo la placa de hielo
  for (const fn of G.fins) drawFin(fn.x, false);
  if (G.cine && G.cine.fin) drawFin(G.cine.fin.x, true);
  if (G.mullet) drawMullet(G.mullet.x, G.mullet.y, G.mullet.v >= 0 ? 1 : -1, G.mullet.ph, false);

  // línea de pesca
  const H = G.hook;
  const sway = Math.sin(G.time * 2 + H.y * 0.01) * 3;
  ctx.strokeStyle = C.line;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(ROD_TIP.x, ROD_TIP.y);
  ctx.quadraticCurveTo(LINE_X, (ROD_TIP.y + ICE_Y) / 2, LINE_X, ICE_Y + 4);
  ctx.quadraticCurveTo(LINE_X + sway, (ICE_Y + H.y) / 2, LINE_X + sway * 0.4, H.y - 8);
  ctx.stroke();

  ctx.strokeStyle = '#D8E6F2';
  ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(LINE_X + sway * 0.4, H.y, 6, -0.4, Math.PI * 0.9);
  ctx.stroke();

  const hx = LINE_X + sway * 0.4;
  if (H.stunT > 0 && Math.floor(G.time * 14) % 2 === 0) {
    // parpadeo durante aturdimiento
  } else if (!H.attached) {
    if (G.worms > 0) drawWorm(hx, H.y + 2);
  } else if (H.attached.type === 'fish') {
    drawFish(hx, H.y + 8, 1, H.attached.ph, true, H.attached.kind === 'g');
  } else if (H.attached.type === 'junk') {
    drawJunk(hx, H.y + 12, H.attached.kind, Math.sin(G.time * 6) * 0.2);
  } else if (H.attached.type === 'mullet') {
    drawMullet(hx, H.y + 22, 1, H.attached.ph, true);
  }

  if (G.bolts > 0) {
    ctx.strokeStyle = '#FFE85C';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      let px = hx, py = H.y;
      ctx.moveTo(px, py);
      for (let s = 0; s < 3; s++) {
        px += rand(-14, 14); py += rand(-14, 14);
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }

  // hielo
  const ig = ctx.createLinearGradient(0, 0, 0, ICE_Y);
  ig.addColorStop(0, C.sky);
  ig.addColorStop(0.55, C.ice);
  ig.addColorStop(1, C.iceShade);
  ctx.fillStyle = ig;
  ctx.fillRect(0, 0, VW, ICE_Y);
  ctx.fillStyle = C.iceEdge;
  ctx.fillRect(0, ICE_Y - 3, VW, 3);
  ctx.strokeStyle = 'rgba(140,180,210,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(430, 40); ctx.lineTo(500, 78); ctx.lineTo(560, 70);
  ctx.moveTo(620, 110); ctx.lineTo(690, 128);
  ctx.stroke();

  ctx.fillStyle = C.hole;
  ctx.beginPath();
  ctx.ellipse(LINE_X, ICE_Y - 6, 34, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#8FB9D6';
  ctx.lineWidth = 3;
  ctx.stroke();

  drawPile();
  drawCooler();
  drawFisher();
  if (G.robot) drawRobot(G.robot);

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (const s of G.snow) {
    ctx.beginPath(); ctx.arc(s.x, s.y, 1.8, 0, Math.PI * 2); ctx.fill();
  }

  for (const p of G.parts) {
    ctx.globalAlpha = clamp(p.t * 2, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const f of G.floats) {
    ctx.globalAlpha = clamp(f.t, 0, 1);
    text(f.txt, f.x, f.y, 16, '800', f.color, 'center');
    ctx.globalAlpha = 1;
  }
}

/* ---------- Dibujo: HUD ---------- */
function drawCoinIcon(x, y, r) {
  ctx.fillStyle = C.gold;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C.goldDark;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, r - 3, 0, Math.PI * 2); ctx.stroke();
}
function drawHUD() {
  ctx.fillStyle = C.panel;
  rrect(10, 10, 306, 40, 12); ctx.fill();
  drawCoinIcon(32, 30, 11);
  text(String(G.coins), 50, 31, 19, '800', C.text, 'left');
  for (let i = 0; i < CONFIG.WORMS; i++) {
    const x = 108 + i * 18;
    ctx.globalAlpha = i < G.worms ? 1 : 0.22;
    drawWorm(x, 20);
    ctx.globalAlpha = 1;
  }
  text('carnadas', 122, 44, 9, '600', '#9FBBD1', 'center');
  ctx.strokeStyle = 'rgba(160,205,235,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(172, 16); ctx.lineTo(172, 44); ctx.stroke();

  if (G.phase === 'cinematic' || G.phase === 'fight' ||
      (G.phase === 'announce' && G.robot && G.robot.after === 'fight')) {
    text('EL MULLET', 186, 22, 14, '900', C.gold, 'left');
    text('pez enganchado = carnada', 186, 40, 10, '600', '#9FBBD1', 'left');
  } else {
    text('Oleada ' + G.wave + '/5', 186, 22, 14, '800', C.text, 'left');
    const total = CONFIG.WAVE_TIME[G.wave - 1];
    const frac = G.phase === 'wave' ? clamp(G.waveT / total, 0, 1) : 1;
    ctx.fillStyle = 'rgba(160,205,235,0.25)';
    rrect(186, 32, 100, 6, 3); ctx.fill();
    ctx.fillStyle = C.gold;
    if (frac > 0.02) { rrect(186, 32, 100 * frac, 6, 3); ctx.fill(); }
  }

  // botón de sonido
  ctx.fillStyle = C.panel;
  rrect(VW - 58, 10, 48, 40, 12); ctx.fill();
  ctx.fillStyle = C.text;
  ctx.beginPath();
  ctx.moveTo(VW - 44, 26); ctx.lineTo(VW - 38, 26); ctx.lineTo(VW - 31, 19);
  ctx.lineTo(VW - 31, 41); ctx.lineTo(VW - 38, 34); ctx.lineTo(VW - 44, 34);
  ctx.closePath(); ctx.fill();
  if (G.muted) {
    ctx.strokeStyle = C.danger; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(VW - 27, 22); ctx.lineTo(VW - 17, 38); ctx.stroke();
  } else {
    ctx.strokeStyle = C.text; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(VW - 29, 30, 6, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(VW - 29, 30, 10, -0.9, 0.9); ctx.stroke();
  }

  if (G.banner) {
    ctx.globalAlpha = clamp(G.banner.t, 0, 1);
    ctx.fillStyle = C.panel;
    const w = 430;
    rrect(VW / 2 - w / 2, 64, w, 36, 12); ctx.fill();
    text(G.banner.txt, VW / 2, 82, 16, '700', C.gold, 'center');
    ctx.globalAlpha = 1;
  }
}

/* ---------- Dibujo: overlays ---------- */
function drawOverlay() {
  ctx.fillStyle = 'rgba(4,14,26,0.62)';
  ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = C.panel;
  rrect(VW / 2 - 270, 112, 540, 372, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(160,205,235,0.35)';
  ctx.lineWidth = 2;
  rrect(VW / 2 - 270, 112, 540, 372, 22); ctx.stroke();

  const pulse = reducedMotion ? 1 : 1 + Math.sin(G.time * 3) * 0.04;

  if (G.state === 'title') {
    text('PESCA EN EL HIELO', VW / 2, 164, 40, '900', C.text, 'center');
    text('Tributo al clásico minijuego de pesca', VW / 2, 198, 15, '600', '#9FBBD1', 'center');
    text('Desliza para mover el anzuelo. Sube cada pez a la superficie.', VW / 2, 240, 15, '600', C.text, 'center');
    text('Sobrevive 5 oleadas, cada una más larga y peligrosa. 3 carnadas.', VW / 2, 266, 15, '600', C.text, 'center');
    text('Medusas: electrocutan tu cable. Tiburones: roban tu pez.', VW / 2, 292, 15, '600', C.text, 'center');
    text('Cangrejo bajo el hielo: sube el anzuelo al hoyo para espantarlo.', VW / 2, 318, 15, '600', C.text, 'center');
    text('El pez gris vale 2 monedas y nada raro.', VW / 2, 344, 15, '600', C.text, 'center');
    text('Al final llega EL MULLET: tiéntalo con un pez y súbelo para ganar.', VW / 2, 376, 15, '700', C.gold, 'center');
    ctx.save();
    ctx.translate(VW / 2, 434); ctx.scale(pulse, pulse);
    text('Toca para jugar', 0, 0, 22, '800', C.gold, 'center');
    ctx.restore();
  } else if (G.state === 'over') {
    text('SIN CARNADA', VW / 2, 178, 38, '900', C.danger, 'center');
    drawCoinIcon(VW / 2 - 56, 252, 15);
    text(String(G.coins) + ' monedas', VW / 2 + 12, 253, 24, '800', C.text, 'center');
    const donde = (G.phase === 'fight' || G.phase === 'cinematic')
      ? 'Caíste ante el Mullet'
      : 'Llegaste a la oleada ' + G.wave + ' de 5';
    text('Peces: ' + G.caught + '  ·  ' + donde, VW / 2, 300, 16, '600', '#9FBBD1', 'center');
    ctx.save();
    ctx.translate(VW / 2, 418); ctx.scale(pulse, pulse);
    text('Toca para reintentar', 0, 0, 22, '800', C.gold, 'center');
    ctx.restore();
  } else if (G.state === 'win') {
    text('¡ATRAPASTE AL MULLET!', VW / 2, 172, 34, '900', C.gold, 'center');
    drawMullet(VW / 2, 244, 1, 0, false);
    drawCoinIcon(VW / 2 - 56, 316, 15);
    text(String(G.coins) + ' monedas', VW / 2 + 12, 317, 24, '800', C.text, 'center');
    text('Peces atrapados: ' + G.caught, VW / 2, 354, 16, '600', '#9FBBD1', 'center');
    ctx.save();
    ctx.translate(VW / 2, 424); ctx.scale(pulse, pulse);
    text('Toca para jugar otra vez', 0, 0, 22, '800', C.gold, 'center');
    ctx.restore();
  }
}

/* ---------- Render ---------- */
function render() {
  const w = window.innerWidth, h = window.innerHeight;
  ctx.fillStyle = '#04101E';
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  if (G.shakeT > 0 && !reducedMotion) {
    ctx.translate(rand(-4, 4) * G.shakeT * 3, rand(-4, 4) * G.shakeT * 3);
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  drawWorld();
  drawHUD();
  if (G.state !== 'play') drawOverlay();
  ctx.restore();
  ctx.restore();
}

/* ---------- Input ---------- */
function toVirtual(clientX, clientY) {
  return { x: (clientX - offX) / scale, y: (clientY - offY) / scale };
}
function beginRun() {
  reset();
  G.state = 'play';
  G.phase = 'announce';
  startRobot(SIGNS[0], 'wave', false);
  startMusic();
}
function onDown(e) {
  const t = e.touches ? e.touches[0] : e;
  const p = toVirtual(t.clientX, t.clientY);
  const a = ac(); if (a && a.state === 'suspended') a.resume();

  if (p.x > VW - 58 && p.x < VW - 10 && p.y > 10 && p.y < 50) {
    G.muted = !G.muted;
    if (MUSIC.gain) MUSIC.gain.gain.value = G.muted ? 0 : MUSIC.level;
    return;
  }
  if (G.state === 'title' || G.state === 'over' || G.state === 'win') {
    beginRun();
    return;
  }
  G.hook.targetY = clamp(p.y, HOOK_MIN, HOOK_MAX);
}
function onMove(e) {
  if (G.state !== 'play') return;
  const t = e.touches ? e.touches[0] : e;
  const p = toVirtual(t.clientX, t.clientY);
  G.hook.targetY = clamp(p.y, HOOK_MIN, HOOK_MAX);
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(e); }, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(e); }, { passive: false });

/* ---------- Loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- PWA: solo cuando está hospedado (HTTPS) ----------
   El archivo abierto en local no necesita nada de esto: ya vive
   completo en el dispositivo. Hospedado, el manifest lo hace
   instalable y el service worker lo deja cacheado offline. */
if (location.protocol === 'https:' || location.hostname === 'localhost') {
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = 'manifest.webmanifest';
  document.head.appendChild(l);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
}

})();
</script>
</body>
